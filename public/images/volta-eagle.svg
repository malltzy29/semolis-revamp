<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgEagle" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <linearGradient id="bodyEagle" x1="140" y1="120" x2="460" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#bgEagle)" />
  <circle cx="500" cy="90" r="105" fill="#0D9488" fill-opacity="0.08" />
  <circle cx="110" cy="320" r="85" fill="#059669" fill-opacity="0.08" />
  <!-- Ground Shadow -->
  <ellipse cx="300" cy="332" rx="195" ry="14" fill="#064E3B" fill-opacity="0.15" />
  <!-- Rear Wheel -->
  <circle cx="178" cy="272" r="54" fill="#111827" />
  <circle cx="178" cy="272" r="36" fill="#1F2937" />
  <circle cx="178" cy="272" r="24" fill="#E5E7EB" />
  <circle cx="178" cy="272" r="10" fill="#0D9488" />
  <!-- Front Wheel -->
  <circle cx="428" cy="272" r="54" fill="#111827" />
  <circle cx="428" cy="272" r="36" fill="#1F2937" />
  <circle cx="428" cy="272" r="24" fill="#E5E7EB" />
  <circle cx="428" cy="272" r="10" fill="#0D9488" />
  <!-- Sleek Sporty Body (Volta Eagle Aerodynamic Silhouette) -->
  <path d="M132 194 L255 186 L308 248 L362 248 L398 134 L456 168 L412 266 L220 266 L132 194 Z" fill="url(#bodyEagle)" />
  <!-- Eagle Beak Front Fairing -->
  <path d="M385 135 L465 172 L438 222 L372 238 Z" fill="#047857" />
  <!-- Dual Hawk-Eye LED Headlight -->
  <path d="M432 162 L462 175 L446 192 L424 180 Z" fill="#ECFEFF" stroke="#2DD4BF" stroke-width="3" />
  <!-- Front Fork & Fender -->
  <path d="M396 162 L428 272" stroke="#111827" stroke-width="12" stroke-linecap="round" />
  <path d="M385 228 Q432 212 474 240 L452 250 Q426 234 394 246 Z" fill="#0D9488" />
  <!-- Ergonomic Split-Style Seat -->
  <path d="M142 162 Q205 154 272 182 L262 202 L138 192 Z" fill="#111827" />
  <!-- Rear Grab Rail -->
  <path d="M120 158 L152 165 L146 176 L114 168 Z" fill="#374151" />
  <!-- Handlebar & Sporty Visor -->
  <path d="M375 98 L410 132 L382 138 Z" fill="#111827" />
  <rect x="348" y="104" width="34" height="12" rx="6" fill="#1F2937" />
  <!-- Side Panel Branding -->
  <text x="192" y="230" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="17" letter-spacing="1">VOLTA EAGLE</text>
  <!-- Badge -->
  <rect x="32" y="28" width="142" height="34" rx="17" fill="#0D9488" />
  <text x="103" y="50" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">SPORT AGILE RIDE</text>
</svg>

