  <circle cx="426" cy="274" r="37" fill="#F9FAFB" />
  <circle cx="426" cy="274" r="26" fill="#D1D5DB" />
  <circle cx="426" cy="274" r="11" fill="#059669" />
  <!-- Rounded Retro-Modern Vespa-esque Body (Volta Mandala) -->
  <path d="M130 238 C130 182 195 176 260 192 L302 248 L366 248 L392 135 L432 148 C448 188 446 235 415 266 L152 266 C136 262 130 250 130 238 Z" fill="url(#bodyMandala)" />
